apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: customer-churn-hpa
  namespace: ml-prod
  labels:
    app: customer-churn-api
    environment: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: customer-churn-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
